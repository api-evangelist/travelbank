name: TravelBank
description: >-
  TravelBank, a U.S. Bank company, is an all-in-one corporate travel, expense,
  and card management platform used by more than 45,000 companies. It combines
  travel booking for flights, hotels, and cars with expense tracking, corporate
  and virtual card reconciliation, approval workflows, and reporting, and ships
  pre-built integrations with QuickBooks, NetSuite, Xero, U.S. Bank, and Brex.
  TravelBank publishes no public developer API: its platform API at
  api.travelbank.com is private and undocumented, and integrations are
  pre-built or delivered as custom work.
